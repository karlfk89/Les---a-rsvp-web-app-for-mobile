# From the repository root: docker compose -f deploy/docker-compose.yml up -d
# Caddy serves app/ straight from this checkout, so `git pull` is the whole update.
# Set SITE_ADDRESS (and TLS_DIRECTIVE) in deploy/.env; see docs/SELVHOSTING.md.
services:
  les:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../app:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
